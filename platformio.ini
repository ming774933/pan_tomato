[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

; --- [關鍵修正] 強制深度搜尋依賴庫 (解決 Adafruit BusIO 找不到 SPI.h 的問題) ---
lib_ldf_mode = deep

lib_deps = 
    SPI
    Wire
    lvgl/lvgl @ ^8.3.11
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/RTClib @ ^2.1.3

build_flags = 
    ; --- LVGL 設定 ---
    -D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_TICK_CUSTOM=1
    -D LV_COLOR_16_SWAP=1        
    
    ; 字型設定
    -D LV_FONT_MONTSERRAT_8=1
    -D LV_FONT_MONTSERRAT_10=1
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_24=1

    ; --- TFT_eSPI 驅動設定 ---
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_BLACKTAB=1
    
    ; 腳位設定 (NodeMCU-32S)
    -D TFT_MISO=-1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    
    ; 效能設定
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000